# SPDX-License-Identifier: Apache-2.0
# Member forwarder for jumbo (Jumbo Build & Versioning Standard,
# section 3.5 "Executors and the Publication Contract"). This is the
# SINGLE workflow file the repository carries, with two modes:
#   - pull_request / push to main calls the reusable jumbo-verify
#     workflow: jumbo lock -> materialize the recorded dependency
#     artifacts -> build -> test. No publication steps, read-only.
#     Repository-specific checks live in the repository's own test
#     surface (an npm verify script or a pytest test), where this
#     pipeline runs them.
#   - workflow_dispatch calls the reusable jumbo-publish workflow: the
#     release path (lock, fingerprint, dedup, promote, publish on bump,
#     index append), unchanged.
# 5e3215f is the JumboBuild commit that owns jumbo-verify (the
# member PR-mode); every release step and every verify step is owned by
# the reusable workflows in zephytiju/JumboBuild.
name: jumbo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA of this repository to release (default: the triggering commit)"
        type: string
        default: ""

jobs:
  # PR-mode: verify every pull request (and pushes to main) through jumbo.
  verify:
    if: github.event_name != 'workflow_dispatch'
    uses: zephytiju/JumboBuild/.github/workflows/jumbo-verify.yml@5e3215f85d381e73863017eb331708998ce101c6
    secrets: inherit
    with:
      jumbobuild-ref: 5e3215f85d381e73863017eb331708998ce101c6
    permissions:
      contents: read

  # Dispatch-mode: the release path.
  jumbo-publish:
    if: github.event_name == 'workflow_dispatch'
    uses: zephytiju/JumboBuild/.github/workflows/jumbo-publish.yml@5e3215f85d381e73863017eb331708998ce101c6
    secrets: inherit
    with:
      jumbobuild-ref: 5e3215f85d381e73863017eb331708998ce101c6
      commit: ${{ inputs.commit }}
      publish-to-public-registry: true
    permissions:
      contents: write
      packages: write
