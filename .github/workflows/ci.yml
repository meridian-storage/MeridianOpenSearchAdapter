# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Static and license checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m mypy src/meridian_storage/adapters/opensearch
          python scripts/check_spdx.py
      - name: Unit, contract, packaging, and Core conformance
        run: |
          python -m pytest -q \
            --cov=meridian_storage.adapters.opensearch \
            --cov-branch \
            --cov-report=term \
            --cov-report=xml \
            tests/unit tests/contract tests/packaging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Test supported interpreter
        run: python -m pytest -q tests/unit tests/contract tests/packaging

  real-single-node:
    name: Real OpenSearch single-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Run digest-pinned ICU conformance
        env:
          MERIDIAN_PYTHON: python
        run: ./scripts/run-single-conformance.sh

  real-cluster:
    name: Real OpenSearch cluster and node loss
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Run three-node replication and node-loss conformance
        env:
          MERIDIAN_PYTHON: python
        run: ./scripts/run-cluster-conformance.sh

  package:
    name: Reproducible package
    needs: [quality, python-compatibility, real-single-node, real-cluster]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Build and verify
        env:
          SOURCE_DATE_EPOCH: "1787702400"
        run: |
          python scripts/verify_reproducible.py
          python -m build
          python -m twine check dist/*
          python scripts/verify_artifacts.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
