# SPDX-License-Identifier: Apache-2.0
x-opensearch-common: &opensearch-common
  build:
    context: .
    args:
      OPENSEARCH_IMAGE: "${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4}"
  image: meridian-opensearch-conformance:${OPENSEARCH_VERSION:-2.19.1}-icu
  environment: &opensearch-environment
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    cluster.name: meridian-cluster-conformance
    discovery.seed_hosts: opensearch-node1,opensearch-node2,opensearch-node3
    cluster.initial_cluster_manager_nodes: opensearch-node1,opensearch-node2,opensearch-node3
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536

services:
  opensearch-node1:
    <<: *opensearch-common
    environment:
      <<: *opensearch-environment
      node.name: opensearch-node1
    ports:
      - "19200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_nodes=3&wait_for_status=green' >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

  opensearch-node2:
    <<: *opensearch-common
    environment:
      <<: *opensearch-environment
      node.name: opensearch-node2

  opensearch-node3:
    <<: *opensearch-common
    environment:
      <<: *opensearch-environment
      node.name: opensearch-node3
