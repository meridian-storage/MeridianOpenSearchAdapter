# SPDX-License-Identifier: Apache-2.0
services:
  opensearch:
    build:
      context: .
      args:
        OPENSEARCH_VERSION: "2.19.1"
    image: meridian-opensearch-conformance:2.19.1-icu
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: single-node
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
